amcl:
  ros__parameters:
    use_sim_time: True
    # MIGLIORATO: Parametri del modello di movimento (ridotti per maggiore precisione)
    alpha1: 0.05  # Era 0.2 - Rotazione causata da rotazione (ridotto)
    alpha2: 0.05  # Era 0.2 - Rotazione causata da traslazione (ridotto)
    alpha3: 0.05  # Era 0.2 - Traslazione causata da traslazione (ridotto)
    alpha4: 0.05  # Era 0.2 - Traslazione causata da rotazione (ridotto)
    alpha5: 0.05  # Era 0.2 - Rumore di traslazione strafe (ridotto)
    
    base_frame_id: "base_footprint"
    beam_skip_distance: 0.5
    beam_skip_error_threshold: 0.9
    beam_skip_threshold: 0.3
    do_beamskip: false
    global_frame_id: "map"
    lambda_short: 0.1
    laser_likelihood_max_dist: 2.0
    laser_max_range: 12.0
    laser_min_range: -1.0
    laser_model_type: "likelihood_field"
    
    # MIGLIORATO: Più beam per migliorare la precisione
    max_beams: 120  # Era 60 - Raddoppiato per maggiore precisione
    
    # MIGLIORATO: Più particelle per localizzazione più accurata
    max_particles: 2000  # Era 500 - Aumentato per maggiore precisione
    min_particles: 200   # Era 50 - Aumentato proporzionalmente
    
    odom_frame_id: "fra2mo/odom"
    pf_err: 0.03  # Era 0.05 - Ridotto per convergenza più precisa
    pf_z: 0.99
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    resample_interval: 1
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    save_pose_rate: 0.5
    
    # MIGLIORATO: Ridotto sigma_hit per match laser più preciso
    sigma_hit: 0.2  # Era 0.9 - Molto ridotto per maggiore precisione
    
    tf_broadcast: true
    
    # MIGLIORATO: Transform tolerance ridotta
    transform_tolerance: 0.1  # Era 0.2 - Dimezzata per maggiore precisione
    
    # MIGLIORATO: Aggiornamenti più frequenti
    update_min_a: 0.15  # Era 0.3 - Ridotto (aggiorna più spesso durante rotazioni)
    update_min_d: 0.1   # Era 0.2 - Ridotto (aggiorna più spesso durante traslazioni)
    
    z_hit: 0.5
    z_max: 0.05
    z_rand: 0.5
    z_short: 0.05
    scan_topic: lidar
    map_topic: map
    set_initial_pose: true
    always_reset_initial_pose: true
    first_map_only: false
    initial_pose:
      x: 0.0
      y: 0.0
      z: 0.0
      yaw: 0.0

amcl_map_client:
  ros__parameters:
    use_sim_time: True

amcl_rclcpp_node:
  ros__parameters:
    use_sim_time: True

behavior_server:
  ros__parameters:
    local_costmap_topic: local_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_costmap_topic: global_costmap/costmap_raw
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 5.0
    behavior_plugins:
      ["spin", "backup", "drive_on_heading", "wait", "assisted_teleop"]
    spin:
      plugin: "nav2_behaviors/Spin"
    backup:
      plugin: "nav2_behaviors/BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors/DriveOnHeading"
    wait:
      plugin: "nav2_behaviors/Wait"
    assisted_teleop:
      plugin: "nav2_behaviors/AssistedTeleop"
    local_frame: fra2mo/odom
    global_frame: map
    robot_base_frame: base_footprint
    transform_tolerance: 0.1
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.4
    rotational_acc_lim: 3.2

bt_navigator:
  ros__parameters:
    use_sim_time: True
    global_frame: map
    robot_base_frame: base_footprint
    odom_topic: model/fra2mo/odometry

    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    navigators: [navigate_to_pose, navigate_through_poses]
    navigate_to_pose:
      plugin: nav2_bt_navigator/NavigateToPoseNavigator
    navigate_through_poses:
      plugin: nav2_bt_navigator/NavigateThroughPosesNavigator
    plugin_lib_names:
      - nav2_compute_path_to_pose_action_bt_node
      - nav2_follow_path_action_bt_node
      - nav2_back_up_action_bt_node
      - nav2_spin_action_bt_node
      - nav2_wait_action_bt_node
      - nav2_clear_costmap_service_bt_node
      - nav2_is_stuck_condition_bt_node
      - nav2_goal_reached_condition_bt_node
      - nav2_goal_updated_condition_bt_node
      - nav2_initial_pose_received_condition_bt_node
      - nav2_reinitialize_global_localization_service_bt_node
      - nav2_rate_controller_bt_node
      - nav2_distance_controller_bt_node
      - nav2_speed_controller_bt_node
      - nav2_truncate_path_action_bt_node
      - nav2_goal_updater_node_bt_node
      - nav2_recovery_node_bt_node
      - nav2_pipeline_sequence_bt_node
      - nav2_round_robin_node_bt_node
      - nav2_transform_available_condition_bt_node
      - nav2_time_expired_condition_bt_node
      - nav2_distance_traveled_condition_bt_node
      - nav2_remove_passed_goals_action_bt_node
      - nav2_compute_path_through_poses_action_bt_node

bt_navigator_rclcpp_node:
  ros__parameters:
    use_sim_time: True

controller_server:
  ros__parameters:
    use_sim_time: True

    # MIGLIORATO: Frequenza controller aumentata
    controller_frequency: 10.0  # Era 5.0 - Raddoppiata per controllo più reattivo
    
    min_x_velocity_threshold: 0.03
    min_y_velocity_threshold: 0.03
    min_theta_velocity_threshold: 0.3
    failure_tolerance: 2.0

    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.5
      movement_time_allowance: 10.0

    goal_checker_plugin: "goal_checker"
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # MIGLIORATO: Tolleranze ridotte per precisione maggiore
      xy_goal_tolerance: 0.05   # Era 0.1 - Dimezzata per maggiore precisione
      yaw_goal_tolerance: 0.1   # Era 0.2 - Dimezzata per maggiore precisione
      stateful: True

    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"

      # MIGLIORATO: Velocità ridotta per maggiore controllo
      desired_linear_vel: 0.3  # Era 0.4 - Ridotta del 25%
      
      # MIGLIORATO: Lookahead distances ottimizzate
      lookahead_dist: 0.5        # Era 0.6 - Ridotta
      min_lookahead_dist: 0.3    # Era 0.4 - Ridotta
      max_lookahead_dist: 0.7    # Era 0.9 - Ridotta
      lookahead_time: 1.5        # Era 2.0 - Ridotto
      
      # MIGLIORATO: Transform tolerance ridotta
      transform_tolerance: 0.05  # Era 0.1 - Dimezzata
      
      use_velocity_scaled_lookahead_dist: true
      min_approach_linear_velocity: 0.05  # Era 0.1 - Ridotta per avvicinamento più lento
      approach_velocity_scaling_dist: 0.6  # Era 0.5 - Aumentata leggermente
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0

      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: true  # Era false - ATTIVATO per rallentare vicino ostacoli

      regulated_linear_scaling_min_radius: 0.5  # Era 0.7 - Ridotto per curve più strette
      regulated_linear_scaling_min_speed: 0.15  # Era 0.2 - Ridotta velocità minima
      allow_reversing: false
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.5  # Era 0.785 - Ridotto per rotare più spesso
      
      # MIGLIORATO: Accelerazione angolare ridotta per movimenti più fluidi
      max_angular_accel: 3.5  # Era 5.0 - Ridotta del 30%
      rotate_to_heading_angular_vel: 1.5  # Era 1.8 - Ridotta
      
      max_robot_pose_search_dist: 10.0
      use_interpolation: true

controller_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: True

      # MIGLIORATO: Update più frequenti
      update_frequency: 15.0  # Era 10.0 - Aumentata del 50%
      publish_frequency: 15.0  # Era 10.0 - Aumentata del 50%
      
      global_frame: fra2mo/odom
      robot_base_frame: base_footprint

      width: 3
      height: 3
      resolution: 0.02
      rolling_window: True
      always_send_full_costmap: True

      robot_radius: 0.11
      #footprint: "[[0.17, 0.17], [0.17, -0.17], [-0.17, -0.17], [-0.17, 0.17]]"
      footprint_padding: 0.03

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # MIGLIORATO: Inflation radius ridotto per passare più vicino
        inflation_radius: 0.3  # Era 0.4 - Ridotto del 25%
        cost_scaling_factor: 2.0  # Era 1.0 - Aumentato per gradiente più ripido
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /lidar
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True

  local_costmap_client:
    ros__parameters:
      use_sim_time: True
  local_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: True

      # MIGLIORATO: Update più frequenti anche per global costmap
      update_frequency: 5.0  # Era 10.0 - Ridotta (global non serve così frequente)
      publish_frequency: 5.0  # Era 10.0 - Ridotta
      
      global_frame: map
      robot_base_frame: base_footprint

      resolution: 0.05
      always_send_full_costmap: True
      track_unknown_space: True

      robot_radius: 0.11
      # footprint: "[[0.17, 0.17], [0.17, -0.17], [-0.17, -0.17], [-0.17, 0.17]]"
      footprint_padding: 0.03

      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: True
        # MIGLIORATO: Mantenuta inflation più alta per global planning
        inflation_radius: 0.35  # Era 0.4 - Ridotto leggermente
        cost_scaling_factor: 2.5  # Era 2.0 - Aumentato
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        scan:
          topic: /lidar
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5
          obstacle_min_range: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        enabled: True
        map_subscribe_transient_local: True

  global_costmap_client:
    ros__parameters:
      use_sim_time: True
  global_costmap_rclcpp_node:
    ros__parameters:
      use_sim_time: True

map_server:
  ros__parameters:
    use_sim_time: True
    yaml_filename: "map.yaml"

map_saver:
  ros__parameters:
    use_sim_time: True
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: True

planner_server:
  ros__parameters:
    use_sim_time: True
    expected_planner_frequency: 1.0

    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      # MIGLIORATO: Tolleranza ridotta per path più precisi
      tolerance: 0.1  # Era 0.2 - Dimezzata
      use_astar: false
      allow_unknown: true

planner_server_rclcpp_node:
  ros__parameters:
    use_sim_time: True

smoother_server:
  ros__parameters:
    use_sim_time: True

waypoint_follower:
  ros__parameters:
    use_sim_time: True
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: True
      waypoint_pause_duration: 200

velocity_smoother:
  ros__parameters:
    use_sim_time: True

    # MIGLIORATO: Smoothing più frequente
    smoothing_frequency: 10.0  # Era 5.0 - Raddoppiata
    scale_velocities: False
    feedback: "OPEN_LOOP"
    
    # MIGLIORATO: Velocità massime ridotte per maggiore controllo
    max_velocity: [0.4, 0.0, 1.2]   # Era [0.5, 0.0, 1.5] - Ridotte del 20%
    min_velocity: [-0.4, 0.0, -1.2]  # Era [-0.5, 0.0, -1.5] - Ridotte
    
    # MIGLIORATO: Accelerazioni ridotte per movimenti più fluidi
    max_accel: [1.0, 0.0, 2.5]   # Era [1.5, 0.0, 3.0] - Ridotte ~30%
    max_decel: [-1.0, 0.0, -2.5]  # Era [-1.5, 0.0, -3.0] - Ridotte
    
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0
